[package]
name = "mscz"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pure-Rust MusicXML 3.1, MuseScore 4 (.mscx/.mscz), and bekern+ sheet music serialization, decoding, and validation library and CLI"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mscz-rs/mscz-rs"
homepage = "https://github.com/mscz-rs/mscz-rs"
documentation = "https://docs.rs/mscz"
keywords = ["musescore", "musicxml", "music-notation", "mscz", "bekern"]
categories = ["multimedia::audio", "encoding", "parser-implementations"]
exclude = [".github/", "AGENTS.md", "ARCHITECTURE.md", "CONTRIBUTING.md"]

[features]
default = ["cli", "bekern", "lattice"]
cli = ["dep:clap", "dep:serde_json", "bekern", "lattice"]
bekern = []
lattice = ["dep:serde_json"]
wasm = ["bekern"]

[lib]
name = "mscz"
path = "src/lib.rs"

[[bin]]
name = "mscz"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "04_bekern_ml_roundtrip"
required-features = ["bekern"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
