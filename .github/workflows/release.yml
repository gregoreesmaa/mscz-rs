name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing to crates.io"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Verify, Publish & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${CRATE_VERSION}" ]; then
            echo "::error::Could not extract version from Cargo.toml"
            exit 1
          fi
          if [ "${CRATE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CRATE_VERSION}) does not match git tag (${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "Verified Cargo.toml version ${CRATE_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Clippy (no default features)
        run: cargo clippy --no-default-features -- -D warnings

      - name: Run tests (all features)
        run: cargo test --all-features

      - name: Run tests (no default features)
        run: cargo test --no-default-features

      - name: Build docs (warnings denied)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::workflow_dispatch dry_run enabled; running cargo publish --dry-run and skipping upload."
            cargo publish --dry-run
            exit 0
          fi
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            if [ "${IS_DISPATCH}" = "true" ]; then
              echo "::notice::CARGO_REGISTRY_TOKEN is not set; running cargo publish --dry-run and skipping crates.io publish."
              cargo publish --dry-run
              exit 0
            fi
            echo "::error::CARGO_REGISTRY_TOKEN secret is required for tagged releases."
            exit 1
          fi
          cargo publish --token "${CARGO_REGISTRY_TOKEN}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
